name: CI/CD - Deploy Connectors to AWS Glue

on:
  push:
    branches: [main]
    paths:
      - 'src/connectors/**'
      - 'scripts/**'
      - '.github/workflows/deploy_connectors.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/connectors/**'

env:
  AWS_REGION: us-east-1
  S3_LANDING_BUCKET: ${{ vars.S3_LANDING_BUCKET || 'my-enterprise-lakehouse-raw' }}
  GLUE_ROLE_ARN: ${{ vars.GLUE_ROLE_ARN || 'arn:aws:iam::123456789012:role/AWSGlueServiceRole' }}

jobs:
  validate-and-test:
    name: Lint, Compile & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Validate Python Syntax (py_compile)
        run: |
          python3 -m py_compile src/connectors/sharepoint/connector.py
          python3 -m py_compile src/connectors/confluence/connector.py

      - name: Lint Code Quality
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/connectors/ --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy-to-glue:
    name: Deploy to AWS Glue Python Shell
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN || env.GLUE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Connectors via Simple Python S3 Path
        run: |
          chmod +x scripts/deploy_all_connectors.sh
          chmod +x src/connectors/sharepoint/deploy_glue.sh
          chmod +x src/connectors/confluence/deploy_glue.sh

          ./scripts/deploy_all_connectors.sh \
            "${{ env.S3_LANDING_BUCKET }}" \
            "${{ env.GLUE_ROLE_ARN }}" \
            "${{ env.AWS_REGION }}"
